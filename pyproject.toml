[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mt-lattice-fluid"
version = "1.0.0"
description = "Planck lattice fluid M-layer cellular automaton and T-layer readout"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mt_ca*", "verify_checks*"]
