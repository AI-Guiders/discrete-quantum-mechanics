name: Deploy MkDocs Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material & i18n
        run: |
          pip install "mkdocs<2.0" "mkdocs-material>=9.5,<10.0" "mkdocs-static-i18n>=1.2,<2.0"

      - name: Build and deploy to gh-pages branch
        run: |
          mkdocs gh-deploy --force --clean
